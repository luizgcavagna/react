<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Propriedades</title>
</head>

<body>
  <div id="root"></div>

  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">

    const buttonVariantes = {
      default: 'bg-teal-300 hover:bg-teal-600',
      danger: 'bg-red-400 hover:bg-red-600'
    }

    const Button = ({ children, variant = 'default', ...props }) => {
      return (
        <button
          className={`${buttonVariantes[variant]} px-3 py-2 text-white cursor-pointer rounded-md`}
          {...props}
        >
          {children}
        </button>
      )
    }

    const App = () => {
      return (
        <main className="flex gap-2 p-3">
          <h1>Hello World!</h1>
          <Button>
            Salvar
          </Button>
          <Button variant="danger">
            Deletar
          </Button>
        </main>
      )
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <App />
    )
  </script>
</body>

</html>
